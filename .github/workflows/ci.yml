name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Audit gate: fail on HIGH/CRITICAL only. Moderate dev-only advisories
      # (vitest/vite/esbuild dev-server scope, drizzle-kit esbuild-kit chain)
      # are tracked, not build-blocking. Review weekly via `npm audit`.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm audit --json > /tmp/audit.json || true
      - name: Assert zero HIGH/CRITICAL vulns
        run: python3 scripts/audit-gate.py /tmp/audit.json
      - run: npm run build
